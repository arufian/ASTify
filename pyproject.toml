[project]
name = "astify"
version = "0.1.0"
description = "ASTify — embedding-based knowledge graph extraction, zero AI tokens"
requires-python = ">=3.9"
dependencies = [
    "sentence-transformers>=2.2.0",
    "spacy>=3.5.0",
    "keybert>=0.8.0",
    "scikit-learn>=1.2.0",
    "PyMuPDF>=1.23.0",
    "hnswlib>=0.7.0",
    "PyYAML>=6.0",
    "numpy>=1.24.0",
    "networkx>=3.0",
    "pyvis>=0.3.0",
]

[project.scripts]
astify = "astify.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["astify*"]
