[project]
name = "embedgraph"
version = "0.1.0"
description = "Embedding-based knowledge graph extraction — zero AI tokens"
requires-python = ">=3.9"
dependencies = [
    "sentence-transformers>=2.2.0",
    "spacy>=3.5.0",
    "keybert>=0.8.0",
    "scikit-learn>=1.2.0",
    "PyMuPDF>=1.23.0",
    "hnswlib>=0.7.0",
    "PyYAML>=6.0",
    "numpy>=1.24.0",
]

[project.scripts]
embedgraph = "embedgraph.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
